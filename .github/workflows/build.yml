name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        id: build
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Rename APK
        if: success()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/LeitorIngles-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LeitorIngles-apk
          path: out/*.apk

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Leitor Inglês 1.0.${{ github.run_number }}
          body: |
            APK do Leitor Inglês. No Boox, baixe o arquivo .apk abaixo e toque nele para instalar.
          files: out/*.apk
          make_latest: true

      - name: Save build log on failure
        if: failure()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          cp build.log /tmp/build.log || echo "no log" > /tmp/build.log
          git fetch origin build-logs || true
          git checkout -B build-logs
          git rm -rq --cached . || true
          rm -rf ./* .github || true
          cp /tmp/build.log build.log
          git add build.log
          git commit -m "build log ${{ github.run_number }}" || true
          git push -f origin build-logs
